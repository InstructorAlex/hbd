<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Luisa 💖</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="bg-hearts">
    <div class="heart h1"></div>
    <div class="heart h2"></div>
    <div class="heart h3"></div>
    <div class="heart h4"></div>
    <div class="heart h5"></div>
  </div>

  <section id="welcome-screen">
    <div class="welcome-card">
      <div class="heart-icon">💙</div>
      <h1>Para mi Luisa</h1>
      <button id="btn-start">Te amo</button>
    </div>
  </section>

  <main id="main-content" class="hidden">
    
    <header>
      <h2 class="fecha-titulo">1 de septiembre de 2026</h2>
    </header>

    <section class="card carousel-card">
      <div class="carousel-container">
        <div class="carousel-track" id="track">
          <div class="slide"><img src="img/foto1.jpg" alt="Foto 1"></div>
          <div class="slide"><img src="img/foto2.jpg" alt="Foto 2"></div>
          <div class="slide"><img src="img/foto3.jpg" alt="Foto 3"></div>
          <div class="slide"><img src="img/foto4.jpg" alt="Foto 1"></div>
          <div class="slide"><img src="img/foto5.jpg" alt="Foto 2"></div>
          <div class="slide"><img src="img/foto6.jpg" alt="Foto 3"></div>
        </div>
        <button class="carousel-btn prev" id="prevBtn">&#10094;</button>
        <button class="carousel-btn next" id="nextBtn">&#10095;</button>
      </div>
    </section>

    <section class="card envelope-section">
      <div class="envelope" id="envelope">
        <div class="envelope-front">
          <button id="btn-open-envelope">Abrir</button>
        </div>
        <div class="letter hidden" id="letter">
          <h3>¡Feliz Cumpleaños!</h3>
          <p>
            Hoy es un día sumamente especial. Quiero desearte un año lleno de sonrisas, éxitos 
            y momentos memorables. Gracias por ser una persona tan increíble y por llenar cada 
            día de tanta alegría.
          </p>
          <button id="btn-celebrate">¡Celebrar! 🎉</button>
        </div>
      </div>
    </section>

    <section class="card final-section">
      <img src="foto_final.jpg" alt="Luisa Fernanda" class="final-photo">
      <h2 class="final-message">¡Feliz Cumpleaños, Luisa Fernanda! ✨</h2>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
